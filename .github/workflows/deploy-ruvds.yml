name: Deploy Aida to RU VDS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aida-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUVDS_HOST }}
          username: ${{ secrets.RUVDS_USER }}
          key: ${{ secrets.RUVDS_SSH_KEY }}
          port: 22
          command_timeout: 18m
          script_stop: true
          script: |
            set -e

            echo "==> Updating repository"
            git config --global --add safe.directory /opt/aida || true
            cd /opt/aida
            git -c core.sshCommand="ssh -i /home/aida/.ssh/aida2_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" fetch origin main
            git reset --hard origin/main

            echo "==> Building frontend"
            cd /opt/aida/frontend
            corepack enable
            corepack prepare yarn@1.22.22 --activate
            yarn install
            npx expo export -p web

            echo "==> Restarting backend"
            systemctl restart aida-backend

            echo "==> Validating nginx"
            nginx -t
            systemctl reload nginx

            echo "==> Health checks"
            curl --fail --silent --show-error http://127.0.0.1/api/ >/tmp/aida-api-health.json
            grep -q '"status":"ok"' /tmp/aida-api-health.json
            curl --fail --silent --show-error http://127.0.0.1/ >/dev/null

            echo "Deployment completed successfully"
